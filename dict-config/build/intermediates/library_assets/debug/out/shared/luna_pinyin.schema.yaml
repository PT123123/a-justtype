# RIME schema: luna_pinyin (明月拼音)
# A popular Chinese input schema for RIME

schema:
  schema_id: luna_pinyin
  name: 明月拼音
  version: "0.22"
  author:
    - 佛振 <chen.sst@gmail.com>
  description: |
    明月拼音，簡化字方案。
    以 Unicode CJK 基本區漢字爲基準。
  dependencies:
    - stroke

translator:
  dictionary: luna_pinyin
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/
  comment_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/

reverse_lookup:
  dictionary: stroke
  enable_completion: true
  prefix: "`"
  suffix: "'"
  tips: 〔反查〕

punctuator:
  import_preset: default

key_binder:
  import_preset: default

recognizer:
  import_preset: default
